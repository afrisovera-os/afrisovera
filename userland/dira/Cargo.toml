[package]
name = "dira"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Dira, AfriSovera's web browser, as a ring-3 process on the PC (Dira M3 S4, AFR-0001 7.6)."
publish = false

# Its own workspace, like dira-host: built alone by scripts/build-dira.sh for x86_64-unknown-none, with its own
# profile (the root workspace's profiles do not reach an excluded crate). No dependencies.
[workspace]

[[bin]]
name = "dira"
path = "src/main.rs"
test = false
bench = false

# The architect's S4 verdict, Q1: opt-level "s" so the program fits its code cap, with debug assertions and
# overflow checks on (an arithmetic mistake stops at its line, as in the stick's build).
[profile.dev]
panic = "abort"
opt-level = "s"
debug-assertions = true
overflow-checks = true
debug = false
codegen-units = 1
incremental = false

[profile.release]
panic = "abort"
opt-level = "s"
debug-assertions = true
overflow-checks = true
codegen-units = 1
