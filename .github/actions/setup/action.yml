# Shared set-up for every test job: packages, QEMU (built once, then cached), and the pinned Rust toolchain.
name: Set up the AfriSovera test tools
description: Install build packages, QEMU from cache (or build it), and the pinned Rust toolchain
inputs:
  qemu-version:
    description: QEMU version to build
    default: '11.0.0'
  # The hash is checked by hand once per version, not just taken from the download (architect, 22 Nov 2026):
  # 11.0.0 on 22 Nov 2026: two downloads gave this sha256, and qemu-11.0.0.tar.xz.sig is a good signature by the
  # QEMU release key CEACC9E15534EBABB82D3FA03353C9CEF108B584 (Michael Roth), the fingerprint qemu.org/download lists.
  # At a version change: hash the new tarball, verify its .sig the same way, then change both values together.
  qemu-sha256:
    description: sha256 of qemu-<version>.tar.xz, checked against QEMU's signed release (see the comment above)
    default: 'c04ca36012653f32d11c674d370cf52a710e7d3f18c2d8b63e4932052a4854d6'
  rust-version:
    description: Rust toolchain (must match rust-toolchain.toml)
    default: '1.97.1'
runs:
  using: composite
  steps:
    - name: Packages
      shell: bash
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq > /dev/null
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq expect procps ninja-build libglib2.0-dev \
          libpixman-1-dev libslirp-dev libpng-dev flex bison python3-venv bzip2 swtpm swtpm-tools > /dev/null  # swtpm: pc-tpm (F3 step 3)

    # The tcp suites start a small host listener on 127.0.0.1:80 (QEMU's user network maps the guest's
    # 10.0.2.2:80 to it). Runners are not root, so let ordinary processes bind ports below 1024.
    - name: Allow low host ports
      shell: bash
      run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0

    - name: QEMU from cache
      id: qemu-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/tools/qemu
        # v3: built with the test patches in scripts/ci/qemu-*.patch (usb-net's NCM mode for pc-usbncm); the key
        # hashes them, so a changed patch builds QEMU again. v4 (public only, architect 22 Nov 2026): built from the
        # sha256-checked tarball, so no QEMU from before the check is used
        key: qemu-${{ inputs.qemu-version }}-aarch64-x86_64-${{ runner.os }}-v4-${{ hashFiles('scripts/ci/qemu-*.patch') }}

    # QEMU 11 is required: older distribution builds fail some suites (heap). The first run builds it
    # (about 20 minutes); every later run restores it from the cache.
    - name: Build QEMU (first run only)
      if: steps.qemu-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        V: ${{ inputs.qemu-version }}
        SUM: ${{ inputs.qemu-sha256 }}
      run: |
        curl -fsSL --retry 3 -o /tmp/qemu.txz "https://download.qemu.org/qemu-$V.tar.xz"
        # the tarball must be the one hashed in this file (architect, 22 Nov 2026): a mismatch stops the build
        sha256sum -c <<< "$SUM  /tmp/qemu.txz" || { echo "qemu-$V.tar.xz does not match its pinned sha256"; exit 3; }
        tar -xJf /tmp/qemu.txz -C /tmp
        cd "/tmp/qemu-$V"
        # test equipment only, never part of AfriSovera: e.g. usb-net's NCM mode, which pc-usbncm needs
        for f in "$GITHUB_WORKSPACE"/scripts/ci/qemu-*.patch; do
          [ -e "$f" ] || continue
          patch -p1 < "$f" > /dev/null || { echo "QEMU test patch $f did not apply"; exit 3; }
        done
        ./configure --prefix="$HOME/tools/qemu" --target-list=aarch64-softmmu,x86_64-softmmu --enable-slirp \
          --disable-docs --disable-werror > /tmp/qemu-configure.log 2>&1 || { tail -30 /tmp/qemu-configure.log; exit 3; }
        make -j"$(nproc)" > /tmp/qemu-build.log 2>&1 || { tail -30 /tmp/qemu-build.log; exit 3; }
        make install > /dev/null

    - name: QEMU on PATH
      shell: bash
      run: |
        echo "$HOME/tools/qemu/bin" >> "$GITHUB_PATH"
        "$HOME/tools/qemu/bin/qemu-system-aarch64" --version | sed -n 1p

    - name: Rust
      shell: bash
      env:
        RV: ${{ inputs.rust-version }}
      run: |
        rustup toolchain install "$RV" --profile minimal --target aarch64-unknown-none \
          --target x86_64-unknown-uefi --target x86_64-unknown-none --component rust-src,llvm-tools
        echo "RUSTUP_TOOLCHAIN=$RV" >> "$GITHUB_ENV"
