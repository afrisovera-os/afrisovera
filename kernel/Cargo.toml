[package]
name = "mansa-kernel"
version = "0.0.1"
edition = "2021"
description = "Mansa — AfriSovera's capability-based microkernel (Phase 0: boot + UART)."
license = "Apache-2.0"

[[bin]]
name = "mansa-kernel"
path = "src/main.rs"

# The PC kernel (x86-64, a UEFI application): PC track step 1, docs/05. A second
# binary of the SAME crate so it shares source files with the ARM kernel; gated on
# the `pc` feature so the default ARM build never tries to build it.
#   cargo build -p mansa-kernel --bin mansa-pc --features pc --target x86_64-unknown-uefi
[[bin]]
name = "mansa-pc"
path = "src/pc/main.rs"
required-features = ["pc"]

[features]
# Target board. Default = QEMU `virt` (fully featured). `board-raspi` selects the
# Raspberry Pi 3 (BCM2837 / QEMU raspi3b) bring-up; `board-rpi4` selects the
# Raspberry Pi 4 (BCM2711) peripheral map — addresses only, no boot path yet;
# `board-pine64` selects the PINE64 / Allwinner A64 map, which additionally needs a
# DesignWare 8250 UART driver before it could ever print. See docs/15 and
# kernel/src/board.rs.
default = ["board-virt"]
board-virt = []
board-raspi = []
board-rpi4 = []
board-pine64 = []
pc = []
# A build marked for release (PC: --features pc,release). It refuses to compile while any demo key is trusted
# (AFR-0010 section 7, pc/update.rs); off in every test build, so it changes nothing there.
release = []
# Test only (pc-releaseguard): a release build with one planted row, the demo update key's bytes marked
# `demo: false`, to prove the byte check catches it. Never for a real build.
releaseguard-plant = ["release"]

[dependencies]
# ADR 0007 (kernel dependencies): third-party crates for CRYPTOGRAPHIC PRIMITIVES only, exact `=` pins, no
# default features, confined to kernel/src/mesh/. They arrive through our own path crates, which hold the pins:
# mesh-noise / mesh-hpke -> x25519-dalek =2.0.1, ed25519-dalek =2.1.1, chacha20poly1305 =0.10.1. Protocol
# logic (Noise state machine, HPKE key schedule, AFR-0009 framing) is ours. Cargo.lock is committed.
#
# ARM only: the mesh module is in the ARM kernel only (Phase 0), and the PC kernel's x86_64-unknown-uefi target
# cannot build poly1305's x86 SIMD backend (measured in the cloud, 10 Nov 2026). The PC binary links none of them.
[target.'cfg(target_arch = "aarch64")'.dependencies]
mesh-crypto = { path = "../mesh-crypto" }
mesh-noise = { path = "../mesh-noise" }
mesh-hpke = { path = "../mesh-hpke" }

# ADR 0007 row "Wi-Fi primitives" (architect, 14 Nov 2026): the PC kernel's Wi-Fi takes its primitives (SHA-1, HMAC,
# PBKDF2, AES, CCM, AES key wrap, CMAC) from pinned RustCrypto crates through our path crate wlan-crypto, used only
# by kernel/src/wlan/crypto.rs. x86_64 only: the ARM kernel links none of it. Software AES only (aes_force_soft in
# .cargo/config.toml, checked by scripts/wifi-crypto-test.sh): the PC kernel saves no SIMD state.
[target.'cfg(target_arch = "x86_64")'.dependencies]
wlan-crypto = { path = "../wlan-crypto" }
